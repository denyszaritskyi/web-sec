<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Поділитися сторінкою</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f4f6f8;color:#1f2937;margin:0;padding:40px 20px;}
  .card{max-width:480px;margin:0 auto;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:28px 32px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
  h1{font-size:1.2rem;margin:0 0 6px;}
  p.lead{color:#64748b;margin:0 0 18px;font-size:.88rem;}
  .msg{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:14px 16px;min-height:22px;}
  .hint{margin-top:16px;font-size:.72rem;color:#94a3b8;}
  a#shareBtn{display:inline-block;background:#2563eb;color:#fff;padding:9px 16px;border-radius:6px;text-decoration:none;font-size:.9rem;}
</style>
</head>
<body>
  <div class="card">
    <h1>Поділитися публікацією</h1>
    <p class="lead">Варіант 9</p>
    <div class="msg">
      <a id="shareBtn" href="#">Поділитися</a>
    </div>
    <p class="hint">Спробуйте додати до адреси: #link=https://example.com/post/42</p>
  </div>
  <script>
    var params = new URLSearchParams(location.hash.slice(1));
    var link = params.get('link');
    if (link) {
      document.getElementById('shareBtn').outerHTML =
        '<a id="shareBtn" href="' + link + '">Поділитися</a>';
    }
  </script>
</body>
</html>
